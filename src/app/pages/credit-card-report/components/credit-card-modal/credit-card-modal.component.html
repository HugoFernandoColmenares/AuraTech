<div class="modal-overlay flex-center" role="dialog" aria-modal="true" aria-labelledby="credit-card-import-title">
  <div class="modal-card flex-column gap-l p-l fade-in">
    <header class="modal-header flex-column gap-s">
      <h2 id="credit-card-import-title" class="modal-title">Import Statement</h2>
      <p class="modal-subtitle">
        Process transactions from <strong>{{ pendingFileName() }}</strong>?
      </p>
    </header>

    <footer class="modal-footer flex-end gap-m">
      <button type="button" class="btn btn-ghost" (click)="cancel.emit()">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="confirm.emit()">Import File</button>
    </footer>
  </div>
</div>
