<div class="inventory-container flex-column gap-l p-l">

  @if (showUpload()) {

    <input

      #inventoryFileInput

      type="file"

      class="hidden-input"

      accept=".xlsx,.xls"

      (change)="onFileSelected($event)"

    />

    <app-report-upload-placeholder

      icon="📦"

      title="No Inventory Data Active"

      description="Import an inventory Excel file to view stock analytics, alerts, and AI insights."

      (browse)="triggerFileInput()"

    />

  } @else if (initialDataReady()) {

    <app-view-controls

      title="Inventory Intelligence"

      [showBorder]="false"

      [options]="viewOptions"

      [activeMode]="viewMode()"

      (modeChange)="setViewMode($event)"

    />



    <app-main-table-filter

      [showAccounts]="false"

      [showDates]="false"

      [(searchQuery)]="searchFilter"

      (clearFilters)="searchFilter.set(''); divisionFilter.set(''); typeFilter.set(''); statusFilter.set(''); onGlobalFiltersChanged()">



      <div class="filter-group">

        <label class="filter-label">Status</label>

        <select class="filter-select" [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)">

          <option value="">All Statuses</option>

          @for (s of availableStatuses; track s) {

            <option [value]="s">{{ s }}</option>

          }

        </select>

      </div>



      <div class="filter-group">

        <label class="filter-label">Division</label>

        <select class="filter-select" [ngModel]="divisionFilter()" (ngModelChange)="divisionFilter.set($event); onGlobalFiltersChanged()">

          <option value="">All Divisions</option>

          @for (d of availableDivisions(); track d) {

            <option [value]="d">{{ d }}</option>

          }

        </select>

      </div>



      <div class="filter-group">

        <label class="filter-label">Type</label>

        <select class="filter-select" [ngModel]="typeFilter()" (ngModelChange)="typeFilter.set($event); onGlobalFiltersChanged()">

          <option value="">All Types</option>

          @for (t of availableTypes(); track t) {

            <option [value]="t">{{ t }}</option>

          }

        </select>

      </div>

    </app-main-table-filter>



    @if (viewMode() === 'table') {

      <app-inventory-table

        [data]="tableDisplayRows()"

        [columns]="columns()"

        [isSkuSplit]="isSkuSplit()"

        [selectionReset]="tableSelectionReset()"

        [localCount]="dataSourceCounts().local"
        [databaseCount]="dataSourceCounts().database"

        (isSkuSplitChange)="isSkuSplit.set($event)"

        (createRecord)="openCreateForm()"

        (actionClick)="handleTableAction($event)"

        (bulkActionClick)="handleBulkTableAction($event)"

        (exportExcel)="exportTableToExcel()"
        (exportJson)="downloadJson()"

        (exportToDatabase)="exportToDatabase()"

        (clearData)="resetData()"

        (fileSelected)="onFileSelected($event)"

      />

    }



    @if (viewMode() === 'charts') {

      <app-inventory-analytics
        [data]="filteredData()"
        [serverAnalytics]="inventoryServerAnalytics()"
        (exportJson)="downloadJson()"
        (exportToDatabase)="exportToDatabase()"
        (clearData)="resetData()"
        (fileSelected)="onFileSelected($event)"
        (showAlerts)="showAlerts()"
        (analyticsFiltersChange)="onAnalyticsFiltersChange($event)"
      />

    }



    @if (viewMode() === 'insights') {

      <div class="insights-view fade-in">

        <app-insights-report [report]="inventoryInsights()" />

      </div>

    }

  }



  <app-inventory-modal

    [showStoreSelection]="showStoreModal()"

    [showRecordForm]="showRecordModal()"

    [pendingFileName]="pendingFile?.name ?? ''"

    [selectedAccount]="selectedAccount()"

    (selectedAccountChange)="selectedAccount.set($event)"

    [record]="selectedRecord()"

    [formMode]="formMode()"

    (storeConfirm)="confirmUpload()"

    (storeCancel)="showStoreModal.set(false)"

    (recordSave)="onFormSave($event)"

    (recordCancel)="showRecordModal.set(false)"

  />

</div>
