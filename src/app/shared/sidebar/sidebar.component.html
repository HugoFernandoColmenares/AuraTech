<aside class="sidebar flex-column">
  <div class="sidebar-top flex-column">
    <div class="sidebar-header flex-between p-m align-center">
      <h2>AuraTech</h2>
      <button class="close-btn" (click)="sidebarService.close()" aria-label="Close Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <nav class="sidebar-nav flex-column gap-s p-m">
      @for (item of menuItems(); track item.path) {
        <a [routerLink]="item.path" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{ exact: false }"
           (click)="sidebarService.close()" 
           class="nav-item">
          {{ item.label }}
        </a>
      }
    </nav>
  </div>
  
  <div class="sidebar-footer p-m flex-column">
    <button (click)="logout()" class="nav-item logout-btn flex-center gap-s">
      <span class="icon">🚪</span> Logout
    </button>
  </div>
</aside>
