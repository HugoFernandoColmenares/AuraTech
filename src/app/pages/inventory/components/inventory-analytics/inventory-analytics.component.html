<app-table-header-actions
  title="Inventory Analytics"
  (exportJson)="exportJson.emit()"
  (exportToDatabase)="exportToDatabase.emit()"
  (clearData)="clearData.emit()"
  (fileSelected)="fileSelected.emit($event)"
>
  <button type="button" class="btn btn-warning btn-sm" (click)="showAlerts.emit()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    Check Status
  </button>
</app-table-header-actions>

<app-chart-panel class="fade-in">
  <div panelPrimary class="flex-between align-center flex-wrap gap-m">
    <div class="chart-type-tags flex gap-s" role="tablist" aria-label="Inventory analytics views">
      @for (config of chartConfigs; track config.key) {
        <button
          type="button"
          class="chart-btn"
          role="tab"
          [class.active]="activeChart() === config.key"
          [attr.aria-selected]="activeChart() === config.key"
          (click)="activeChart.set(config.key)"
        >
          <span class="chart-btn-icon">{{ config.icon }}</span>{{ config.label }}
        </button>
      }
    </div>
    <button
      type="button"
      class="btn btn-sm btn-ghost"
      [class.active]="showVisualChart()"
      (click)="showVisualChart.set(!showVisualChart())"
    >
      📊 {{ showVisualChart() ? 'Hide Chart' : 'Show Chart' }}
    </button>
  </div>

  <div panelSecondary>
    <h3 class="chart-title">{{ activeChartLabel() }}</h3>
  </div>

  <div panelFilters class="pivot-table-controls flex gap-m align-center flex-wrap">
    <label class="checkbox-container">
      <input type="checkbox" [ngModel]="excludeZeroAvailable()" (ngModelChange)="onExcludeZeroAvailableChange($event)" />
      <span class="checkbox-label font-semibold">Exclude zero available</span>
    </label>
    <label class="checkbox-container">
      <input type="checkbox" [ngModel]="excludeZeroOnHand()" (ngModelChange)="onExcludeZeroOnHandChange($event)" />
      <span class="checkbox-label font-semibold">Exclude zero on hand</span>
    </label>
  </div>

  @if (showVisualChart()) {
    <div class="chart-wrapper">
      <app-chart [type]="chartConfig().type" [data]="chartConfig().data" [options]="chartConfig().options" />
    </div>
  }

  <div class="analytical-table-container">
    <app-data-table
      [columns]="chartTableColumns()"
      [data]="chartTableRows()"
      [pageSize]="15"
      [footer]="chartTableFooter()"
      defaultSortKey="stock"
      defaultSortDir="desc"
    />
  </div>
</app-chart-panel>
