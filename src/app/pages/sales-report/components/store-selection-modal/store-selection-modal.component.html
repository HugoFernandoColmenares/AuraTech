<div class="modal-overlay flex-center" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-subtitle">
  <div class="modal-card flex-column gap-l p-l fade-in">
    <header class="modal-header">
      <h2 id="modal-title" class="modal-title">Select File Format</h2>
      <p id="modal-subtitle" class="modal-subtitle">Choose how to parse <strong>{{ pendingFileName() }}</strong></p>
    </header>

    <main class="store-categories flex-column gap-l">
      <section class="category-group flex-column gap-m">
        <h3 class="category-title">Import</h3>
        <div class="store-options grid-auto gap-m">
          @for (store of formatStores; track store.value) {
            <label class="store-option" [class.active]="selectedStore() === store.value">
              <input
                type="radio"
                name="store"
                [value]="store.value"
                [ngModel]="selectedStore()"
                (ngModelChange)="selectedStore.set($event)" />
              <div class="store-card flex-column gap-s">
                <span class="store-icon" aria-hidden="true">{{ store.icon }}</span>
                <span class="store-name">{{ store.name }}</span>
                <span class="store-desc">{{ store.description }}</span>
              </div>
            </label>
          }
        </div>
      </section>
    </main>

    <footer class="modal-footer flex gap-m flex-end">
      <button class="btn btn-secondary" (click)="cancel.emit()">Cancel</button>
      <button class="btn btn-primary" (click)="confirm.emit(selectedStore())">Process File</button>
    </footer>
  </div>
</div>
